<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect width="640" height="480" fill="#0d0c0a"/>
  <text x="50" y="60" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#f8f6f1">AI Prediction Market Debates</text>
  <text x="50" y="86" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#9fe870">THREE AGENTS · ONE FORECAST</text>

  <!-- three debating agent nodes converging on a center outcome -->
  <g stroke="#9fe870" stroke-width="2" fill="none" opacity="0.7">
    <line x1="150" y1="180" x2="320" y2="270"/>
    <line x1="320" y1="150" x2="320" y2="270"/>
    <line x1="490" y1="180" x2="320" y2="270"/>
  </g>

  <g font-family="Georgia, serif" font-size="12" fill="#0d0c0a">
    <circle cx="150" cy="180" r="34" fill="#9fe870"/>
    <text x="150" y="185" text-anchor="middle" font-weight="700">A1</text>
    <circle cx="320" cy="150" r="34" fill="#9fe870"/>
    <text x="320" y="155" text-anchor="middle" font-weight="700">A2</text>
    <circle cx="490" cy="180" r="34" fill="#9fe870"/>
    <text x="490" y="185" text-anchor="middle" font-weight="700">A3</text>
  </g>

  <circle cx="320" cy="270" r="46" fill="none" stroke="#f8f6f1" stroke-width="3"/>
  <text x="320" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="1" fill="#f8f6f1">FORECAST</text>
  <text x="320" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="1" fill="#9fe870">OUTCOME</text>

  <g font-family="Georgia, serif" font-size="11" fill="#f8f6f1" opacity="0.75">
    <text x="150" y="222" text-anchor="middle">DEBATE</text>
    <text x="320" y="192" text-anchor="middle">DEBATE</text>
    <text x="490" y="222" text-anchor="middle">DEBATE</text>
  </g>

  <text x="50" y="450" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#f8f6f1" opacity="0.5">MOCKUP PREVIEW · PLACEHOLDER</text>
</svg>
