<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect width="640" height="480" fill="#0d0c0a"/>
  <text x="50" y="60" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#f8f6f1">Combat Sport Analytics</text>
  <text x="50" y="86" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#9fe870">WRESTLING · UFC · MMA — SENTIMENT DASHBOARD</text>

  <!-- bar chart -->
  <g fill="#9fe870" opacity="0.9">
    <rect x="60" y="290" width="46" height="110"/>
    <rect x="130" y="230" width="46" height="170"/>
    <rect x="200" y="260" width="46" height="140"/>
    <rect x="270" y="180" width="46" height="220"/>
    <rect x="340" y="240" width="46" height="160"/>
    <rect x="410" y="150" width="46" height="250"/>
  </g>

  <!-- sentiment wave -->
  <polyline points="60,190 130,160 200,205 270,120 340,175 410,95 480,140 550,110"
            fill="none" stroke="#f8f6f1" stroke-width="3" opacity="0.7"/>
  <g fill="#f8f6f1" opacity="0.9">
    <circle cx="60" cy="190" r="4"/>
    <circle cx="130" cy="160" r="4"/>
    <circle cx="200" cy="205" r="4"/>
    <circle cx="270" cy="120" r="4"/>
    <circle cx="340" cy="175" r="4"/>
    <circle cx="410" cy="95" r="4"/>
    <circle cx="480" cy="140" r="4"/>
    <circle cx="550" cy="110" r="4"/>
  </g>

  <text x="50" y="450" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#f8f6f1" opacity="0.5">MOCKUP PREVIEW · PLACEHOLDER</text>
</svg>
