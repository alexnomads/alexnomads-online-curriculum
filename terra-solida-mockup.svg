<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0c0a"/>
      <stop offset="100%" stop-color="#1a3d00"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163300"/>
      <stop offset="100%" stop-color="#0d0c0a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#sky)"/>
  <!-- Colosseum silhouette (simplified arches) -->
  <g fill="none" stroke="#9fe870" stroke-width="2" opacity="0.85">
    <rect x="90" y="150" width="460" height="150" rx="6"/>
    <g stroke="#9fe870" stroke-width="2">
      <circle cx="130" cy="185" r="14"/>
      <circle cx="175" cy="185" r="14"/>
      <circle cx="220" cy="185" r="14"/>
      <circle cx="265" cy="185" r="14"/>
      <circle cx="310" cy="185" r="14"/>
      <circle cx="355" cy="185" r="14"/>
      <circle cx="400" cy="185" r="14"/>
      <circle cx="445" cy="185" r="14"/>
      <circle cx="490" cy="185" r="14"/>
    </g>
    <g stroke="#9fe870" stroke-width="2">
      <circle cx="130" cy="230" r="14"/>
      <circle cx="175" cy="230" r="14"/>
      <circle cx="220" cy="230" r="14"/>
      <circle cx="265" cy="230" r="14"/>
      <circle cx="310" cy="230" r="14"/>
      <circle cx="355" cy="230" r="14"/>
      <circle cx="400" cy="230" r="14"/>
      <circle cx="445" cy="230" r="14"/>
      <circle cx="490" cy="230" r="14"/>
    </g>
  </g>
  <!-- ground / flooring layers -->
  <rect x="0" y="300" width="640" height="180" fill="url(#ground)"/>
  <g stroke="#9fe870" stroke-width="1.5" opacity="0.5">
    <line x1="0" y1="330" x2="640" y2="330"/>
    <line x1="0" y1="365" x2="640" y2="365"/>
    <line x1="0" y1="400" x2="640" y2="400"/>
    <line x1="0" y1="435" x2="640" y2="435"/>
  </g>
  <!-- label -->
  <text x="50" y="60" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#f8f6f1">Il Colosseo, Oggi</text>
  <text x="50" y="86" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#9fe870">SUSTAINABLE CONSTRUCTION — AI VIDEO MOODBOARD</text>
  <text x="50" y="450" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#f8f6f1" opacity="0.5">MOCKUP PREVIEW · PLACEHOLDER</text>
</svg>
